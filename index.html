<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BCOIN 451 TRANSPARAN</title>
<style>body{background:#000;color:#ffb700;font-family:monospace;padding:12px}
.box{border:2px solid #ffb700;border-radius:14px;padding:14px;text-align:center;margin-bottom:14px}
.green{border-color:#00ff88;color:#00ff88}
a{color:#00ff88;word-break:break-all}
</style></head><body>
<div class="box green" id="top">Loading 451 Blocks...</div>
<div class="box">
Source: blockchain.json - Terbuka Untuk Umum<br>
Auto Sync: <span id="sync">-</span> | Validasi: <span id="val">-</span><br><br>
<a href="https://github.com/wtanta84-rgb/B-Coin/blob/main/blockchain.json" target="_blank">📂 Lihat blockchain.json ASLI</a><br>
<a href="https://cdn.jsdelivr.net/gh/wtanta84-rgb/B-Coin@main/blockchain.json" target="_blank">📂 CDN (Anti Cache)</a>
</div>
<div class="box" style="text-align:left">
Supply: <span id="supply">-</span> BCOIN | Blocks: <span id="blocks">-</span><br><br>
<div id="wallets">Loading wallets...</div>
</div>
<script>
async function load(){
  const url=`https://cdn.jsdelivr.net/gh/wtanta84-rgb/B-Coin@main/blockchain.json?v=${Date.now()}`;
  try{
    const res=await fetch(url,{cache:'no-store'});
    const chain=await res.json();
    let ok=true;
    for(let i=1;i<chain.length;i++){
      if(chain[i].previous_hash!==chain[i-1].hash){ok=false;break;}
    }
    document.getElementById('top').innerHTML=`${chain.length} Blocks ${chain.length*50} BCOIN TRANSPARAN ✅ VALID<br>Blocks: ${chain.length} | Supply: ${chain.length*50} | Richest: wtanta84 👑 ${chain.length*50}<br><br>${ok?'✅ Chain VALID 100% - Tidak Ada Curang!':'❌ Chain Rusak'}`;
    document.getElementById('supply').innerText=chain.length*50;
    document.getElementById('blocks').innerText=chain.length;
    const now=new Date().toLocaleTimeString('id-ID');
    document.getElementById('sync').innerText=now;
    document.getElementById('val').innerText=now+' - VALID';
    const counts={};
    chain.forEach(b=>counts[b.miner]=(counts[b.miner]||0)+1);
    let html='💰 Top Wallets - Terbuka<br>';
    Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([m,c])=>{
      html+=`${m} ${m.includes('wtanta84')?'👑 BOSS':''} - ${c*50} BCOIN terverifikasi<br>`;
    });
    document.getElementById('wallets').innerHTML=html;
  }catch(e){document.getElementById('top').innerText='Error load: '+e;}
}
load();
</script>
</body></html>
