<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>BCOIN TRANSPARAN</title>
<style>body{background:#000;color:#ffb700;font-family:monospace;padding:10px}
.box{border:2px solid #ffb700;border-radius:15px;padding:15px;text-align:center;margin-bottom:15px}
.red{border-color:red;color:#ff5555}
a{color:#0f0}</style></head><body>
<div class="box" id="top">Loading...</div>
<div class="box red" id="alert" style="display:none"></div>
<div class="box">Supply: <span id="supply">-</span> BCOIN<br>Blocks: <span id="blocks">-</span><br>Source: blockchain.json - Terbuka Untuk Umum<br>
Auto Sync: <span id="sync">-</span> | Validasi: <span id="val">-</span><br><br>
<a id="src" href="https://github.com/wtanta84-rgb/B-Coin/blob/main/blockchain.json" target="_blank">📂 Lihat blockchain.json ASLI (Source of Truth)</a>
</div>
<div class="box" style="text-align:left"><div id="wallets">Top Wallets - Terbuka<br>Loading...</div></div>
<script>
async function load(){
  const t=Date.now();
  // pakai jsDelivr + cache buster biar langsung update, bukan raw.githubusercontent yang nge-cache
  const url=`https://cdn.jsdelivr.net/gh/wtanta84-rgb/B-Coin@main/blockchain.json?v=${t}`;
  try{
    const res=await fetch(url,{cache:'no-store'});
    const chain=await res.json();
    // validasi
    let valid=true, msg="";
    for(let i=0;i<chain.length;i++){
        const b=chain[i];
        const prev=i==0?'0'.repeat(64):chain[i-1].hash;
        if(b.previous_hash!==prev){valid=false;msg=`Block #${i} previous_hash salah!`;break;}
        const text=`${b.index}${b.previous_hash}${b.timestamp}${b.data}${b.nonce}`;
        const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
        const hex=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
        if(hex!==b.hash || !b.hash.startsWith('0')){valid=false;msg=`Block #${i} TIDAK VALID!`;break;}
    }
    document.getElementById('top').innerHTML=`${chain.length} Blocks ${chain.length*50} BCOIN TRANSPARAN<br>Blocks: ${chain.length} | Supply: ${chain.length*50} | Richest: wtanta84 👑 ${chain.length*50}`;
    document.getElementById('supply').innerText=chain.length*50;
    document.getElementById('blocks').innerText=chain.length;
    const now=new Date().toLocaleTimeString('id-ID');
    document.getElementById('sync').innerText=`Sinkron ${now}`;
    document.getElementById('val').innerText=now;
    if(!valid){
        const a=document.getElementById('alert');
        a.style.display='block';
        a.innerHTML=`❌ TERDETEKSI CURANG! ${msg} Chain Rusak!`;
    } else {
        document.getElementById('alert').style.display='none';
    }
    // wallets
    const counts={};
    chain.forEach(b=>counts[b.miner]=(counts[b.miner]||0)+1);
    let html="";
    Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,20).forEach(([m,c])=>{
        html+=`${m} ${m=='wtanta84-rgb'?'👑 BOSS':''} - ${c*50} BCOIN terverifikasi<br>`;
    });
    document.getElementById('wallets').innerHTML='💰 Top Wallets - Terbuka<br>'+html;
  }catch(e){console.log(e);document.getElementById('top').innerText='Gagal load, refresh lagi... '+e;}
}
load();setInterval(load,10000);
</script></body></html>
