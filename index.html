<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B-Coin Explorer - wtanta84 SULTAN</title>
<style>body{background:#0f0f0f;color:#ffa500;font-family:monospace;padding:10px}#box{border:2px solid #ffa500;border-radius:10px;padding:10px;text-align:center;margin-bottom:15px} .card{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:10px;margin-bottom:10px} .hash{color:#ffa500;font-size:10px;word-break:break-all}</style>
</head><body>
<div id="box">LOADING...</div>
<div id="top" class="card"></div>
<div id="latest" class="card"></div>
<script>
fetch('blockchain.json?v='+Date.now()).then(r=>r.json()).then(chain=>{
  const supply = chain.reduce((s,b)=>s+(b.data?.amount||0),0);
  const wallets={}; chain.forEach(b=>{if(b.data?.to){wallets[b.data.to]=(wallets[b.data.to]||0)+b.data.amount}});
  let richest=Object.entries(wallets).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('box').innerHTML=`<h2 style="margin:0">${chain.length} Blocks ${supply} BCOIN LIVE</h2><div>Blocks: ${chain.length} | Supply: ${supply} BCOIN | Richest: ${richest[0]} 👑 ${richest[1]}<br>Best: ${chain[chain.length-1]?.hash||''}</div>`;
  document.getElementById('top').innerHTML='<h3>💰 Top Wallets</h3>'+Object.entries(wallets).sort((a,b)=>b[1]-a[1]).slice(0,5).map(w=>`<div>${w[0]} ${w[0]=='wtanta84'?'👑':''} - ${w[1]}</div>`).join('');
  document.getElementById('latest').innerHTML='<h3>⛓ Latest 10 Blocks</h3>'+chain.slice(-10).reverse().map((b,i)=>`<div style="border-bottom:1px solid #333;padding:5px 0">#${chain.length-1-i} <span class="hash">${b.hash.substring(0,30)}...</span><br>${JSON.stringify(b.data)}</div>`).join('');
});
</script></body></html>
