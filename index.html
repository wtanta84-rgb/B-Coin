<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B-Coin 195</title><style>body{background:#0a0a0a;color:#eee;font-family:Arial;text-align:center;padding:8px} .card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:14px;margin:10px auto;max-width:850px} .you{background:#221e00;border:1px solid #f0b90b} h1{color:#f0b90b} table{width:100%;border-collapse:collapse;font-size:11px} th{background:#222;color:#f0b90b;padding:7px;position:sticky;top:0} td{padding:5px;border-bottom:1px solid #222} .search{width:92%;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#fff}</style></head><body><h1>🪙 B-Coin Global 195</h1><div class="card you" id="you">📍 Detecting...</div><div class="card" id="chain">Loading 326 blocks...</div><input class="search" id="q" placeholder="🔍 Search 195 countries" onkeyup="filt()"><div class="card"><table id="tbl"></table></div><script>
const C=[["ID", "Indonesia"], ["US", "USA"], ["JP", "Japan"], ["CN", "China"], ["SA", "Saudi Arabia"], ["RU", "Russia"], ["GB", "UK"], ["DE", "Germany"], ["FR", "France"], ["BR", "Brazil"]];
function render(){let t='<tr><th>Flag</th><th>Country</th><th>Code</th><th>B-Coin Address</th></tr>'; C.forEach(x=>{let f=String.fromCodePoint(127397+x[0].charCodeAt(0))+String.fromCodePoint(127397+x[0].charCodeAt(1)); let a='BCOIN_'+x[0]+'_'+Math.random().toString(36).substr(2,6).toUpperCase(); t+=`<tr><td>${f}</td><td style=text-align:left>${x[1]}</td><td>${x[0]}</td><td style="font-family:monospace;color:#f0b90b">${a}</td></tr>`}); document.getElementById('tbl').innerHTML=t;}
function filt(){let q=document.getElementById('q').value.toLowerCase(); document.querySelectorAll('#tbl tr').forEach((r,i)=>{if(i==0)return; r.style.display=r.innerText.toLowerCase().includes(q)?'':'none'})}
fetch('https://ipapi.co/json/').then(r=>r.json()).then(d=>{document.getElementById('you').innerHTML=`<h3>📍 You from ${d.country_name} (${d.country_code})</h3><p>City ${d.city} | IP ${d.ip}</p><p>Your Address: <b style=color:#f0b90b>BCOIN_${d.country_code}_${d.ip.replace(/\./g,'').substr(0,8)}</b></p>`});
fetch('https://raw.githubusercontent.com/wtanta84-rgb/B-Coin/main/blockchain.json?v='+Date.now()).then(r=>r.json()).then(b=>{document.getElementById('chain').innerHTML=`<h2>⛏️ ${b.length} Blocks | ${b.length*50} / 21M | ✅ VALID</h2>`});
render();
</script></body></html>
