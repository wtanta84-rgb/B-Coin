<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>B-Coin Kalapagenep</title>
<style>:root{--bg:#0a0e13;--card:#111822;--gold:#f0b90b;--green:#0ecb81;--text:#e8eef5}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:var(--bg);color:var(--text);padding:16px}.logo{font-weight:900;font-size:22px;color:var(--gold)}.card{background:#111822;border-radius:16px;padding:16px;margin:12px 0;border:1px solid #1f2a39}.balance{font-size:38px;font-weight:900;color:var(--gold)}.btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;cursor:pointer}.btn-gold{background:var(--gold);color:#000}.input{width:100%;background:#0d131d;border:1px solid #1f2a39;border-radius:10px;padding:12px;color:#fff;margin:6px 0}.block{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a2636;font-size:13px}.hash{font-family:monospace;color:var(--gold);font-size:10px;word-break:break-all}
</style></head><body>
<div style="display:flex;justify-content:space-between"><div class="logo">B-COIN Kalapagenep</div><div style="background:#0ecb81;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800">MAINNET LIVE • 26 BLOCKS</div></div>
<div class="card"><div style="opacity:0.6;font-size:12px">Genesis 00000367b3747167 • 1300 BCOIN</div><div class="balance">1,300 BCOIN</div><div style="opacity:0.6;font-size:12px">Chain ID 8888 • Founder wtanta84</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><button class="btn btn-gold" onclick="refresh()">🔄 Refresh</button><button class="btn" style="background:#1b2738;color:#fff;border:1px solid #2a3a52" onclick="document.getElementById('send').scrollIntoView()">📤 Kirim</button></div></div>
<div class="card" id="send"><h3>📤 Kirim B-Coin</h3><input class="input" id="toAddr" placeholder="Tujuan (warga01)"><input class="input" id="amount" type="number" placeholder="Jumlah (50)"><input class="input" id="note" placeholder="Catatan"><button class="btn btn-gold" style="margin-top:8px" onclick="sendCoin()">Kirim Sekarang</button><div id="sendStatus" style="opacity:0.6;font-size:12px;margin-top:8px"></div></div>
<div class="card"><h3>⛓️ Explorer (Live)</h3><div id="chainStatus" style="opacity:0.6;font-size:12px">Loading...</div><div id="blocks"></div></div>
<script>
const URL="https://ltnoqrjhugzxwhemhp.supabase.co";const KEY="sb_publishable_U5nkT7j5YDp-MSGIA2YJMQ_bma5S2gj";const headers={"apikey":KEY,"Authorization":"Bearer "+KEY};
async function refresh(){const s=document.getElementById('chainStatus');s.textContent='Loading...';try{const r=await fetch(`${URL}/rest/v1/bcoin_chain?order=block_number.asc`,{headers});const data=await r.json();s.textContent=`✅ ${data.length} Blocks • ${data.length*50} BCOIN • Last ${data[data.length-1]?.hash?.slice(0,16)}...`;const list=document.getElementById('blocks');list.innerHTML='';data.reverse().slice(0,20).forEach(b=>{const d=document.createElement('div');d.className='block';d.innerHTML=`<div><b>#${b.block_number}</b><br><span class=hash>${b.hash}</span></div><div style=color:#f0b90b;font-weight:800>${b.transactions?.amount||50} B</div>`;list.appendChild(d);});}catch(e){s.textContent='❌ '+e.message;}}
async function sendCoin(){const to=document.getElementById('toAddr').value.trim();const amt=parseInt(document.getElementById('amount').value);const note=document.getElementById('note').value;const st=document.getElementById('sendStatus');if(!to||!amt){st.textContent='Isi alamat & jumlah!';return;}st.textContent='⏳ Mining...';try{const lastRes=await fetch(`${URL}/rest/v1/bcoin_chain?order=block_number.desc&limit=1`,{headers});const last=(await lastRes.json())[0];const nextNum=(last?.block_number||25)+1;const prevHash=last?.hash||'0'.repeat(64);const newHash='0000'+Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b=>b.toString(16).padStart(2,'0')).join('');const block={block_number:nextNum,hash:newHash,prev_hash:prevHash,nonce:8888+nextNum,transactions:{from:'wtanta84',to,amount:amt,note},timestamp:new Date().toISOString()};const r=await fetch(`${URL}/rest/v1/bcoin_chain`,{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(block)});if(r.ok){st.textContent=`✅ Block #${nextNum} terkirim ke ${to} ${amt} BCOIN`;refresh();}else{st.textContent='❌ '+(await r.text()).slice(0,200);}}catch(e){st.textContent='❌ '+e.message;}}
refresh();
</script></body></html>
